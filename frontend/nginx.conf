server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ビルド成果物(assets/)はファイル名にハッシュが入るので長期キャッシュしてよい
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: どのパスにアクセスされてもindex.htmlを返す(ルーティングはReact側の仕事)。
  # index.htmlはキャッシュさせない(古いJSを参照し続ける事故を防ぐ)
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
